name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate project and public tree
        run: |
          python3 scripts/validate_project.py
          python3 scripts/repo_guard.py tree
          python3 scripts/repo_guard.py docs
          python3 scripts/repo_guard.py secrets --scope tree
          python3 scripts/repo_guard.py secrets --scope history

  ios:
    name: iPhone simulator
    needs: public-boundary
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build, test, and capture simulator proof
        run: ./scripts/ci.sh
      - name: Upload simulator proof and compiler logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexquote-ios-proof
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
